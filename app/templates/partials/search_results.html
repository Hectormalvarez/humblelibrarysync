{% for item in items %}
  <div class="search-result-item">
    <strong>{{ item.title }}</strong>
    {% if item.bundle %}
      <span class="bundle">{{ item.bundle.title }}</span>
    {% endif %}
    <span class="publisher">{{ item.publisher }}</span>
  </div>
{% else %}
  <p>No results found.</p>
{% endfor %}
