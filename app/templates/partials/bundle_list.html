<div class="result-list">
  {# Category stream: clicking a bundle row filters the master stream
     by that bundle's id and resets the inspector drawer. #}
  {% for bundle in bundles %}
  <article class="category-row" tabindex="0"
    hx-get="/library/search?bundle_id={{ bundle.id }}"
    hx-target="#master-stream"
    hx-swap="innerHTML"
    hx-on:click="document.querySelectorAll('.mode-pill').forEach(el => el.classList.remove('active')); var bp=document.querySelector('.mode-pill[role=\'tab\']'); bp.classList.add('active'); bp.setAttribute('aria-selected','true'); var si=document.getElementById('library-search'); if(si){si.value=''; si.setAttribute('hx-get', bp.getAttribute('data-endpoint')); si.setAttribute('placeholder', bp.getAttribute('data-placeholder')); htmx.process(si);} hx.ajax('GET', '/library/overview', '#inspector-drawer');">
    <div class="result-info">
      <span class="result-title">{{ bundle.name }}</span>
    </div>
    <div class="result-actions">
      <span class="count-badge">{{ bundle.count }} item{% if bundle.count != 1 %}s{% endif %}</span>
    </div>
  </article>
  {% else %}
    <p>No bundles found.</p>
  {% endfor %}
</div>
