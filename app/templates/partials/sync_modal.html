<div class="sync-modal-overlay" id="sync-modal-overlay">
  <div class="sync-modal-panel drawer-scroll">
    <header class="overview-header" style="display:flex;align-items:center;justify-content:space-between;">
      <div>
        <h2 class="overview-title">Sync Library</h2>
        <p class="overview-subtitle">Enter your Humble Bundle session cookie to sync your library.</p>
      </div>
      <button type="button" class="drawer-close" aria-label="Close sync modal"
        onclick="document.getElementById('sync-modal-container').innerHTML=''">&times;</button>
    </header>

    <form hx-post="/library/sync"
          hx-target="#sync-status"
          hx-swap="innerHTML"
          hx-indicator="#sync-spinner">
      <div class="search-input-wrapper" style="margin-block-end:var(--space-4);">
        <svg
          class="search-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <input
          type="text"
          class="palette-input"
          name="session_cookie"
          placeholder="Paste your _simpleauth_sess cookie value..."
          autocomplete="off"
          autofocus
          required
        />
      </div>

      <div style="display:flex;align-items:center;gap:var(--space-3);">
        <button type="submit" class="mode-pill active" style="cursor:pointer;">
          Sync Now 🔄
        </button>
        <span id="sync-spinner" class="htmx-indicator" style="font-size:var(--text-sm);color:var(--color-text-muted);">
          Syncing…
        </span>
      </div>
    </form>

    <div id="sync-status" style="margin-block-start:var(--space-4);"></div>

    <p class="overview-hint" style="margin-block-start:var(--space-4);">
      Your session cookie is used only for this request and is not stored.
    </p>
  </div>
</div>
