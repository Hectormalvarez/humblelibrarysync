{% extends "layout.html" %}

{% block content %}
<div class="app-workspace">
  <div class="master-pane">
    <div class="control-bar">
      <h1 class="view-title">Library Browser</h1>
      <p class="view-subtitle">Search, filter, and inspect your Humble Bundle library.</p>

      <div class="search-input-wrapper">
        <svg
          class="search-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input
          id="library-search"
          type="search"
          class="palette-input"
          name="q"
          placeholder="Search books..."
          autocomplete="off"
          autofocus
          hx-get="/library/search"
          hx-trigger="input changed delay:300ms, search"
          hx-target="#master-stream"
          hx-include="#library-sort, #master-stream"
        />
        <button
          type="button"
          class="search-clear"
          aria-label="Clear search"
          hidden
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <script>
        // Custom clear button: the native type="search" × is too small to
        // click reliably, so we render our own and wire it to clear the input
        // and dispatch an `input` event so HTMX re-fires the search request.
        (function () {
          var input = document.getElementById("library-search");
          var btn = document.querySelector(".search-clear");
          if (!input || !btn) return;

          function syncVisibility() {
            btn.hidden = input.value.length === 0;
          }

          input.addEventListener("input", syncVisibility);
          input.addEventListener("search", syncVisibility);
          syncVisibility();

          btn.addEventListener("click", function () {
            input.value = "";
            syncVisibility();
            input.focus();
            // Dispatching a real input event lets HTMX's `input changed`
            // trigger fire with the cleared value, refreshing the results.
            input.dispatchEvent(new Event("input", { bubbles: true }));
          });
        })();
      </script>
      <div class="mode-switcher" role="tablist" aria-label="Library view">
        <button type="button" class="mode-pill active" role="tab" aria-selected="true"
          data-endpoint="/library/search"
          data-placeholder="Search books..."
          hx-get="/library/search"
          hx-target="#master-stream"
          hx-swap="innerHTML"
          hx-include="#library-search, #library-sort">📚 Books</button>
        <button type="button" class="mode-pill" role="tab" aria-selected="false"
          data-endpoint="/library/publishers"
          data-placeholder="Search publishers..."
          hx-get="/library/publishers"
          hx-target="#master-stream"
          hx-swap="innerHTML"
          hx-include="#library-search, #library-sort">🏢 Publishers</button>
        <button type="button" class="mode-pill" role="tab" aria-selected="false"
          data-endpoint="/library/bundles"
          data-placeholder="Search bundles..."
          hx-get="/library/bundles"
          hx-target="#master-stream"
          hx-swap="innerHTML"
          hx-include="#library-search, #library-sort">📦 Bundles</button>
      </div>
      <select id="library-sort" name="sort" class="sort-select"
        hx-get="/library/search"
        hx-target="#master-stream"
        hx-swap="innerHTML"
        hx-trigger="change"
        hx-include="#library-search, #master-stream">
        <option value="title_asc">Title (A to Z)</option>
        <option value="title_desc">Title (Z to A)</option>
        <option value="publisher_asc">Publisher (A to Z)</option>
      </select>
      <script>
        // syncSortDropdown – dynamically swaps the <option> list inside
        // #library-sort to match the active view context (books vs.
        // publishers/bundles).  Preserves the currently-selected value
        // unless it is invalid for the target view, in which case it
        // falls back to title_asc.
        function syncSortDropdown(viewType) {
          var sortSelect = document.getElementById('library-sort');
          if (!sortSelect) return;

          var currentValue = sortSelect.value;
          var master = document.getElementById('master-stream');
          var hasFilter = master && (master.querySelector('[name="publisher"]') || master.querySelector('[name="bundle_id"]'));

          if (viewType === 'books') {
            if (hasFilter) {
              // Filtered view: all items share the same publisher/bundle,
              // so publisher_asc is irrelevant — only title sorts shown.
              sortSelect.innerHTML =
                '<option value="title_asc">Title (A to Z)</option>' +
                '<option value="title_desc">Title (Z to A)</option>';
            } else {
              sortSelect.innerHTML =
                '<option value="title_asc">Title (A to Z)</option>' +
                '<option value="title_desc">Title (Z to A)</option>' +
                '<option value="publisher_asc">Publisher (A to Z)</option>';
            }
            if (currentValue === 'count_desc' || currentValue === 'count_asc' ||
                currentValue === 'publisher_asc') {
              sortSelect.value = 'title_asc';
            } else {
              sortSelect.value = currentValue;
            }
          } else if (viewType === 'publishers') {
            sortSelect.innerHTML =
              '<option value="title_asc">Name (A to Z)</option>' +
              '<option value="title_desc">Name (Z to A)</option>' +
              '<option value="count_desc">Most Items</option>' +
              '<option value="count_asc">Least Items</option>';
            if (currentValue === 'publisher_asc' || currentValue === 'date_desc' || currentValue === 'date_asc') {
              sortSelect.value = 'title_asc';
            } else {
              sortSelect.value = currentValue;
            }
          } else if (viewType === 'bundles') {
            sortSelect.innerHTML =
              '<option value="title_asc">Name (A to Z)</option>' +
              '<option value="title_desc">Name (Z to A)</option>' +
              '<option value="count_desc">Most Items</option>' +
              '<option value="count_asc">Least Items</option>' +
              '<option value="date_desc">Newest Purchase</option>' +
              '<option value="date_asc">Oldest Purchase</option>';
            if (currentValue === 'publisher_asc') {
              sortSelect.value = 'title_asc';
            } else {
              sortSelect.value = currentValue;
            }
          }
          htmx.process(sortSelect);
        }

        // Mode pill click handler: clears any active filter state, updates
        // the search input's and sort select's hx-get/placeholder to match
        // the active tab, syncs the sort dropdown options, then lets HTMX
        // fire the pill's own hx-get request.  Search text is preserved so
        // the query carries over across tab switches.
        (function () {
          var pills = document.querySelectorAll('.mode-pill');
          var input = document.getElementById('library-search');
          var sortSelect = document.getElementById('library-sort');
          if (!input) return;

          pills.forEach(function (pill) {
            pill.addEventListener('click', function () {
              // Update active class and aria-selected on all pills
              pills.forEach(function (p) {
                p.classList.remove('active');
                p.setAttribute('aria-selected', 'false');
              });
              this.classList.add('active');
              this.setAttribute('aria-selected', 'true');

              // Determine which tab was clicked
              var endpoint = this.getAttribute('data-endpoint');
              var placeholder = this.getAttribute('data-placeholder');

              // Clear active filter pill if one exists (top-level tab
              // switch removes any drilldown filter context)
              var filterClear = document.querySelector('.filter-clear-btn');
              if (filterClear) {
                // Just remove the pill visually; the content swap below
                // will replace #master-stream anyway so the hidden inputs
                // disappear.  Prevent the clear button's own HTMX request
                // from racing with the tab's request.
                var filterBar = document.querySelector('.filter-bar');
                if (filterBar) filterBar.remove();
              }

              // Update the search input to target the active tab's endpoint
              input.setAttribute('hx-get', endpoint);
              input.setAttribute('placeholder', placeholder);

              // Map endpoint to syncSortDropdown viewType
              var viewType = 'books';
              if (endpoint === '/library/publishers') viewType = 'publishers';
              else if (endpoint === '/library/bundles') viewType = 'bundles';

              // Sync sort dropdown options and set the sort's hx-get route
              syncSortDropdown(viewType);
              if (sortSelect) {
                sortSelect.setAttribute('hx-get', endpoint);
              }

              // Re-process HTMX so it picks up the new hx-get attributes
              htmx.process(input);
            });
          });
        })();
      </script>
      <div class="filter-bar"></div>
    </div>

    <div
      id="master-stream"
      class="stream-container"
      hx-get="/library/search"
      hx-trigger="load"
    ></div>
  </div>

  <div class="inspector-pane">
    <aside id="inspector-drawer" class="drawer-container" hx-get="/library/overview" hx-trigger="load"></aside>
    <footer class="status-footer"></footer>
  </div>
</div>
<script>
  // Global Escape key shortcut: 3-tier cancellation cascade.
  // Tier 1 – Open inspector drawer: click .drawer-close to reset to overview.
  // Tier 2 – Active search: clear #library-search and fire HTMX input event.
  // Tier 3 – Active filter pill: click .filter-clear-btn to remove filters.
  (function () {
    document.addEventListener('keydown', function (event) {
      var key = event.key;
      if (key !== 'Escape' && key !== 'Esc') return;

      // Tier 1: inspector drawer is open (contains a close button)
      var drawerClose = document.querySelector('#inspector-drawer .drawer-close');
      if (drawerClose) {
        drawerClose.click();
        return;
      }

      var searchInput = document.getElementById('library-search');

      // Tier 2: search input has value or is focused
      if (searchInput && (searchInput.value.length > 0 || document.activeElement === searchInput)) {
        searchInput.value = '';
        searchInput.dispatchEvent(new Event('input', { bubbles: true }));
        searchInput.blur();
        return;
      }

      // Tier 3: active filter pill is present
      var filterClear = document.querySelector('.filter-clear-btn');
      if (filterClear) {
        filterClear.click();
        return;
      }
    });
  })();

  // htmx:afterSwap listener on #master-stream to keep mode pills and sort
  // endpoint in sync when content is swapped in (e.g. from drilldown clicks).
  (function () {
    var stream = document.getElementById('master-stream');
    if (!stream) return;
    stream.addEventListener('htmx:afterSwap', function (evt) {
      var master = document.getElementById('master-stream');
      var sortSelect = document.getElementById('library-sort');
      var pills = document.querySelectorAll('.mode-pill');
      if (!master || !pills.length) return;

      // Detect which type of content was swapped in
      var hasFilter = master.querySelector('[name="publisher"]') || master.querySelector('[name="bundle_id"]');
      var hasCategoryRow = master.querySelector('.category-row');
      var hasPublisherList = (hasCategoryRow && master.querySelector('.category-row[class*="category-row"]')
        && master.innerHTML.indexOf('/library/search?publisher=') !== -1);
      var hasBundleList = (hasCategoryRow && master.innerHTML.indexOf('/library/search?bundle_id=') !== -1);

      // Check if the swapped content is a publisher or bundle list partial
      var isPublisherPartial = master.querySelector('.category-row')
        && master.innerHTML.indexOf('hx-get="/library/search?publisher=') !== -1;
      var isBundlePartial = master.querySelector('.category-row')
        && master.innerHTML.indexOf('hx-get="/library/search?bundle_id=') !== -1;

      // Find the pill for the right mode
      var bookPill = document.querySelector('.mode-pill[data-endpoint="/library/search"]');
      var publisherPill = document.querySelector('.mode-pill[data-endpoint="/library/publishers"]');
      var bundlePill = document.querySelector('.mode-pill[data-endpoint="/library/bundles"]');

      function activatePill(pill) {
        if (!pill) return;
        pills.forEach(function (p) {
          p.classList.remove('active');
          p.setAttribute('aria-selected', 'false');
        });
        pill.classList.add('active');
        pill.setAttribute('aria-selected', 'true');
      }

      if (isPublisherPartial) {
        // Publisher list was swapped in
        activatePill(publisherPill);
        syncSortDropdown('publishers');
        if (sortSelect) {
          sortSelect.setAttribute('hx-get', '/library/publishers');
        }
      } else if (isBundlePartial) {
        // Bundle list was swapped in
        activatePill(bundlePill);
        syncSortDropdown('bundles');
        if (sortSelect) {
          sortSelect.setAttribute('hx-get', '/library/bundles');
        }
      } else {
        // Books / search results (including filtered) were swapped in
        activatePill(bookPill);
        syncSortDropdown('books');
        if (sortSelect) {
          sortSelect.setAttribute('hx-get', '/library/search');
        }
      }
    });
  })();
</script>
{% endblock %}
