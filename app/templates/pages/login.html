{% extends "layout.html" %}

{% block content %}
<div class="auth-page">
  <form class="auth-form" id="login-form">
    <h1 class="auth-title">Sign In</h1>
    <div class="auth-field">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" name="email" placeholder="you@example.com" required autocomplete="email">
    </div>
    <div class="auth-field">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" name="password" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <div id="login-error" class="auth-error" hidden></div>
    <button type="submit" class="auth-btn">Login</button>
    <p class="auth-alt">
      Don't have an account? <a href="/register">Register</a>
    </p>
  </form>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  const errorEl = document.getElementById('login-error');
  errorEl.hidden = true;

  const formData = new URLSearchParams();
  formData.append('username', email);
  formData.append('password', password);

  try {
    const res = await fetch('/auth/jwt/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: formData,
      credentials: 'include',
    });
    if (res.ok) {
      window.location.href = '/';
    } else {
      const data = await res.json().catch(() => ({}));
      errorEl.textContent = data.detail || 'Invalid credentials. Please try again.';
      errorEl.hidden = false;
    }
  } catch (err) {
    errorEl.textContent = 'Network error. Please try again.';
    errorEl.hidden = false;
  }
});
</script>
{% endblock %}
