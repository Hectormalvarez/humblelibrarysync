<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Humble Library Sync</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body>
  <nav>
    <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">📚 Library Browser</a>
    <a href="/deals" class="nav-link {% if request.url.path == '/deals' %}active{% endif %}">🌐 Deal Inspector</a>
    {% if user %}
    <a href="#" class="nav-link"
       hx-get="/library/sync/modal"
       hx-target="#sync-modal-container"
       hx-swap="innerHTML">Sync Library 🔄</a>
    <span class="nav-user-badge">{{ user.email }}</span>
    <a href="/auth/logout" class="nav-link nav-logout">Logout</a>
    {% else %}
    <a href="/login" class="nav-link">Login</a>
    <a href="/register" class="nav-link">Register</a>
    {% endif %}
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <div id="sync-modal-container"></div>
</body>
</html>
